services:
  # Optional Docling — PDF/DOCX → text: docker compose --profile docling up -d docling
  docling:
    image: quay.io/docling-project/docling-serve-cpu:latest
    container_name: candidate-docling
    ports:
      - "5001:5001"
    environment:
      - DOCLING_SERVE_ENABLE_UI=true
    profiles:
      - docling
