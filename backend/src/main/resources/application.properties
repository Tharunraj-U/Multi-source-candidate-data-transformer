spring.application.name=candidate-profile-system

# MySQL (local)
spring.datasource.url=jdbc:mysql://localhost:3306/candidate_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP pool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=CandidateHikariPool

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Hibernate logs "undefined/unknown" pool metadata through Hikari — harmless noise
logging.level.org.hibernate.orm.connections.pooling=WARN
logging.level.org.hibernate.engine.jdbc.env.internal.JdbcEnvironmentInitiator=WARN

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Multipart upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# App
app.storage.path=./storage
app.cors.allowed-origins=http://localhost:5173
app.processing.max-attempts=${APP_PROCESSING_MAX_ATTEMPTS:3}

# External services
github.api-token=${GITHUB_TOKEN:}

# Resume text extraction: tika | docling
resume.text.provider=${RESUME_TEXT_PROVIDER:tika}

# Ollama local LLM (Docker)
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434/v1}
ollama.model=${OLLAMA_MODEL:qwen2.5-coder:3b}
ollama.enabled=${OLLAMA_ENABLED:true}
ollama.max-input-chars=${OLLAMA_MAX_INPUT_CHARS:6000}
ollama.max-output-tokens=${OLLAMA_MAX_OUTPUT_TOKENS:2048}

# Docling Serve (Docker) — PDF/DOCX → text/markdown
docling.enabled=${DOCLING_ENABLED:false}
docling.base-url=${DOCLING_BASE_URL:http://localhost:5001}

# Server
server.port=${SERVER_PORT:8080}
